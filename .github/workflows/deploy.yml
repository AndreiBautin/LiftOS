name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one midway — a half-published
# site is worse than an out-of-date one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The deploy is gated on the same verification CI runs. Duplicated
  # minutes are cheap; a pipeline that can publish a commit which failed
  # its own tests is decorative.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          # A GitHub project page serves from /<repo>/, and both the
          # bundler's asset paths and the router's basename derive from
          # this one value. Getting it wrong is how a static SPA deploy
          # ends up with working assets and a 404 on every route.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_LOG_LEVEL: warn

          # **The published build is the demo build, and that is the
          # whole deployment decision.**
          #
          # It moves the database and every storage key to a
          # `lifeos.demo` prefix and fills empty storage with a generated
          # fixture on first open, so a reviewer clicking the link sees a
          # populated app immediately, signs into nothing, and cannot
          # reach or overwrite anything real.
          #
          # There is no server and no account: the app stores everything in
          # the visitor's own browser, and a demo build is the only build.
          VITE_DEMO_MODE: 'true'
        run: pnpm build

      # Static hosts 404 on a client-side route requested cold. Serving
      # the shell as the 404 document turns that into a working deep link.
      # The status code stays 404, which is honest but invisible to a user.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # A green deploy step means an upload succeeded. A green smoke test
      # means the site answered.
      - name: Smoke-test the live site
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Fetching $url"

          for attempt in 1 2 3 4 5; do
            if body=$(curl --fail --silent --show-error --location "$url"); then
              break
            fi
            echo "Attempt $attempt failed; Pages may still be propagating."
            sleep 10
          done

          echo "$body" | grep -q '<div id="root">' \
            || { echo "The response did not contain the app shell."; exit 1; }
          echo "$body" | grep -q 'manifest.webmanifest' \
            || { echo "The response did not link the web manifest."; exit 1; }

          echo "Live site responded with the app shell and a manifest."

      # **The live score, recorded and never gating.** Mobile Lighthouse
      # against the page just deployed, written to the run's summary so
      # each deploy carries its number (docs/PERFORMANCE.md has the
      # history). Report-only on purpose: a shared runner's timings move
      # with its neighbours, and a deploy that already passed its smoke
      # test must not be failed by a noisy measurement.
      - name: Lighthouse (report only)
        continue-on-error: true
        run: |
          set -uo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          npx -y lighthouse@12.6.1 "$url" --quiet --only-categories=performance \
            --form-factor=mobile --chrome-flags="--headless=new --no-sandbox" \
            --output=json --output-path=lighthouse.json
          node -e '
            const r = require("./lighthouse.json")
            const a = r.audits
            const row = ["first-contentful-paint", "largest-contentful-paint",
              "total-blocking-time", "cumulative-layout-shift"].map((k) => a[k].displayValue)
            const score = Math.round(r.categories.performance.score * 100)
            const line = `| ${score} | ${row.join(" | ")} |`
            console.log(line)
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Lighthouse, mobile\n\n| Score | FCP | LCP | TBT | CLS |\n| --- | --- | --- | --- | --- |\n${line}\n`)
          '
