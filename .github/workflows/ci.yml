name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run catches an advisory published against a dependency that
  # has not changed. Without it, a vulnerability only surfaces the next
  # time someone happens to push.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# **Every action is pinned to a commit, with its version beside it.** A
# tag can be moved to different code by whoever controls the action's
# repository; a commit cannot. Dependabot (github-actions) proposes new
# pins with the comment updated, so pinning costs no maintenance.
jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile makes CI fail on a lockfile that drifted from
      # package.json, rather than quietly resolving something different
      # from what runs locally.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

      # The entry chunk against its budget (scripts/check-size.mjs), on the
      # build above. `pnpm verify` runs the same check locally and in deploy.
      - name: Size budget
        run: pnpm size

      - name: Content Security Policy present
        run: pnpm check:csp

      # **Build every configuration that ships.** The demo build takes a
      # different branch at startup — a different storage namespace, and
      # a seeder that runs before the first render — and it is the one
      # that is actually deployed. A failure that only appears under it
      # must not first surface at deploy time.
      - name: Build the demo configuration
        env:
          VITE_DEMO_MODE: 'true'
        run: pnpm build

      # The icons are generated from a checked-in script. If someone edits
      # the script and forgets to run it, the repository and the deployed
      # app disagree about what the app looks like.
      - name: Icons match their generator
        run: |
          node scripts/generate-icons.mjs
          git diff --exit-code -- public/icons

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs real history. The default shallow clone leaves
          # it with a commit range it cannot resolve, which fails the step
          # without having scanned anything — a false alarm that is worse
          # than no scan, because it trains you to ignore the job.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gated at `high` on purpose. A personal app blocked by a moderate
      # advisory in a transitive build-time dependency teaches nothing; a
      # high or critical one is worth stopping for.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
